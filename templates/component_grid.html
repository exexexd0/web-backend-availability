<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Компоненты системы — Список</title>
  <link rel="stylesheet" href="/static/css/availability.css">
</head>
<body>
  <div class="app-shell">
    <main class="app-content">
      <div class="grid-page">
        <header class="grid-page__header">
          <div class="brand">
            <img
              class="brand__mark"
              src="http://localhost:9000/media/%D1%83%D0%B1%D0%BB%D1%8E%D0%B4%D1%81%D0%BA%D0%B0%D1%8F%20%D1%85%D1%83%D0%B9%D0%BD%D1%8F-Photoroom.png"
              alt="ManageEngine"
            >
            <span class="brand__name">ManageEngine</span>
          </div>
        </header>

        <form class="uptime-filter" action="/components" method="get" aria-label="Фильтр по доступности">
          <div class="uptime-filter__head">
            <label class="uptime-filter__label" for="uptime_filter_input">Минимальная доступность</label>
            <output class="uptime-filter__value" id="uptime_filter_value" for="uptime_filter_input">
              {{if .UptimeFilter}}{{.UptimeFilter}}{{else}}0{{end}}%
            </output>
          </div>
          <div class="uptime-filter__control">
            <svg class="uptime-filter__icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l3.7 3.8a1 1 0 0 1-1.4 1.4l-3.8-3.7A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/>
            </svg>
            <input
              class="uptime-filter__input"
              id="uptime_filter_input"
              name="uptime_percent"
              type="range"
              step="0.01"
              min="0"
              max="100"
              value="{{if .UptimeFilter}}{{.UptimeFilter}}{{else}}0{{end}}"
            >
          </div>
          <button class="uptime-filter__submit" type="submit">Применить</button>
        </form>

        <section class="component-grid" aria-label="Опубликованные компоненты системы">
          {{range .Components}}
          <a class="component-card" href="/component/{{.ID}}">
            <div class="component-card__media">
              <img src="{{.ImageURL}}" alt="{{.Name}}">
              <span class="component-card__likes">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12.1 20.3 4.6 13a5.2 5.2 0 0 1 7.4-7.3l.1.1.1-.1a5.2 5.2 0 0 1 7.4 7.3l-7.5 7.3z"/></svg>
                {{.LikesCount}}
              </span>
            </div>
            <div class="component-card__body">
              <h2 class="component-card__title">{{.Name}}</h2>
              <div class="component-card__uptime">
                <span class="component-card__uptime-icon">
                  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9.2 16.6 4.8 12l1.4-1.4 3 3 8-8L18.6 7l-9.4 9.6z"/></svg>
                </span>
                Доступность: {{printf "%.2f" .UptimePercent}}%
              </div>
            </div>
          </a>
          {{else}}
          <p class="grid-empty">Нет опубликованных компонентов с такой доступностью.</p>
          {{end}}
        </section>
      </div>
    </main>

    {{template "tab_bar" .}}
  </div>
  <script src="/static/js/availability.js" defer></script>
</body>
</html>
