  github_com_one-compressive_web-backend-availability_internal_app_ds.ComponentFeedSerializer:
    properties:
      config_type:
        $ref: '#/definitions/github_com_one-compressive_web-backend-availability_internal_app_ds.ConfigType'
      created_at:
        type: string
      description:
        type: string
      formed_at:
        type: string
      id:
