<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Диаграмма последовательности</title>
  <style>
    body { margin: 0; background: #fff; color: #111; font: 14px/1.35 "Segoe UI", sans-serif; }
    h1 { font-size: 18px; margin: 16px 24px 4px; }
    p { margin: 0 24px 12px; color: #333; }
    svg { display: block; margin: 0 auto 24px; }
    .box { fill: #fff; stroke: #222; }
    .life { stroke: #222; stroke-dasharray: 5 4; }
    .msg { stroke: #222; marker-end: url(#arrow); fill: none; }
    .ret { stroke: #222; stroke-dasharray: 6 4; marker-end: url(#arrow); fill: none; }
    text { font-family: "Segoe UI", sans-serif; font-size: 13px; fill: #111; }
    .small { font-size: 12px; }
  </style>
</head>
<body>
  <h1>Диаграмма последовательности бизнес-процесса</h1>
  <p>Линии жизни — домены «Пользователи» и «Услуги». Сигнатура каждого сообщения совпадает с методом диаграммы классов, аргументы указаны в скобках.</p>
  <svg width="1100" height="1280" viewBox="0 0 1100 1280">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <path d="M0,0 L10,4 L0,8 Z" fill="#222"/>
      </marker>
    </defs>
    <rect class="box" x="70" y="20" width="160" height="46" rx="2"/>
    <text x="150" y="48" text-anchor="middle">Клиент</text>
    <rect class="box" x="430" y="20" width="220" height="46" rx="2"/>
    <text x="540" y="48" text-anchor="middle">Пользователи</text>
    <rect class="box" x="820" y="20" width="180" height="46" rx="2"/>
    <text x="910" y="48" text-anchor="middle">Услуги</text>
    <line class="life" x1="150" y1="66" x2="150" y2="1240"/>
    <line class="life" x1="540" y1="66" x2="540" y2="1240"/>
    <line class="life" x1="910" y1="66" x2="910" y2="1240"/>

    <line class="msg" x1="150" y1="110" x2="530" y2="110"/>
    <text class="small" x="170" y="104">1. Login(login, password)</text>
    <line class="ret" x1="530" y1="150" x2="160" y2="150"/>
    <text class="small" x="180" y="144">access_token, token_type, expires_in</text>

    <line class="msg" x1="150" y1="210" x2="900" y2="210"/>
    <text class="small" x="170" y="204">2. GetPublishedComponents(uptime_percent)</text>
    <line class="ret" x1="900" y1="250" x2="160" y2="250"/>
    <text class="small" x="180" y="244">components[]</text>

    <line class="msg" x1="150" y1="310" x2="900" y2="310"/>
    <text class="small" x="160" y="304">3. CreateDraft(name, description, config_type, image, video)</text>
    <line class="ret" x1="900" y1="350" x2="160" y2="350"/>
    <text class="small" x="180" y="344">draft</text>

    <line class="msg" x1="150" y1="410" x2="900" y2="410"/>
    <text class="small" x="170" y="404">4. GetOwnDraft()</text>
    <line class="ret" x1="900" y1="450" x2="160" y2="450"/>
    <text class="small" x="180" y="444">draft</text>

    <line class="msg" x1="150" y1="510" x2="900" y2="510"/>
    <text class="small" x="160" y="504">5. PublishOwnComponent(id, uptime_percent, system_impact)</text>
    <line class="ret" x1="900" y1="550" x2="160" y2="550"/>
    <text class="small" x="180" y="544">component</text>

    <line class="msg" x1="150" y1="610" x2="900" y2="610"/>
    <text class="small" x="170" y="604">6. GetFirstPublishedComponent()</text>
    <line class="ret" x1="900" y1="650" x2="160" y2="650"/>
    <text class="small" x="180" y="644">feed</text>

    <line class="msg" x1="150" y1="710" x2="900" y2="710"/>
    <text class="small" x="170" y="704">7. GetNextComponent(id, next)</text>
    <line class="ret" x1="900" y1="750" x2="160" y2="750"/>
    <text class="small" x="180" y="744">feed</text>

    <line class="msg" x1="150" y1="810" x2="900" y2="810"/>
    <text class="small" x="170" y="804">8. SetComponentLike(id, value)</text>
    <line class="ret" x1="900" y1="850" x2="160" y2="850"/>
    <text class="small" x="180" y="844">component_id, value</text>

    <rect class="box" x="70" y="920" width="960" height="250"/>
    <text x="86" y="948" font-weight="700">signature — свойство сообщения, переиспользовано из диаграммы классов</text>
    <text class="small" x="86" y="976">Пользователи.Login(login: string, password: string): Token</text>
    <text class="small" x="86" y="998">Услуги.GetPublishedComponents(uptime_percent: float): ComponentList[]</text>
    <text class="small" x="86" y="1020">Услуги.CreateDraft(name, description, config_type, image, video): Component</text>
    <text class="small" x="86" y="1042">Услуги.GetOwnDraft(): Component</text>
    <text class="small" x="86" y="1064">Услуги.PublishOwnComponent(id, uptime_percent, system_impact): Component</text>
    <text class="small" x="86" y="1086">Услуги.GetFirstPublishedComponent(): ComponentFeed</text>
    <text class="small" x="86" y="1108">Услуги.GetNextComponent(id: int, next: bool): ComponentFeed</text>
    <text class="small" x="86" y="1130">Услуги.SetComponentLike(id: int, value: int): Like</text>
  </svg>
</body>
</html>
